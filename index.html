<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPC Survey">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="gpc-logo.png">
<title>GPC Field Survey Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
        slate: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a' }
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --text-secondary: #64748b;
  --border: #e2e8f0; --primary: #2563eb; --sidebar-w: 260px; --sidebar-collapsed: 72px;
}
.dark {
  --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8;
  --border: #334155; --primary: #3b82f6;
}
body { background: var(--bg); color: var(--text); transition: background .3s, color .3s; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 2px; }

/* ===== LOADING OVERLAY (for all operations) ===== */
#loading-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .3s;
}
#loading-overlay.active { display: flex; }
#loading-overlay.fade-out { opacity: 0; }
.load-logo-wrap { position: relative; width: 80px; height: 80px; }
.load-logo-wrap img { width: 100%; height: 100%; object-fit: contain; animation: logoPulse 1.8s ease-in-out infinite; }
.load-ring {
  position: absolute; inset: -10px; border: 3px solid transparent;
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes logoPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay .load-text { margin-top: 16px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }

/* ===== INITIAL LOADING SCREEN ===== */
#loading-screen {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; transition: opacity .5s;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 50;
  transition: width .3s ease, background .3s;
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }
.sidebar-header {
  height: 64px; display: flex; align-items: center; padding: 0 16px;
  border-bottom: 1px solid var(--border); gap: 10px; overflow: hidden; position: relative;
}
.sidebar-header img { width: 36px; height: 36px; object-fit: contain; flex-shrink: 0; }
.sidebar-header .brand-text {
  font-weight: 700; font-size: 14px; line-height: 1.2; white-space: nowrap;
  opacity: 1; transition: opacity .2s;
}
.sidebar.collapsed .brand-text { opacity: 0; width: 0; }
.sidebar-toggle {
  position: absolute; right: -14px; top: 18px; width: 28px; height: 28px;
  background: var(--primary); color: white; border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 2px 8px rgba(37,99,235,.4); z-index: 60; font-size: 12px;
  transition: transform .3s;
}
.sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border-radius: 8px; cursor: pointer; color: var(--text-secondary);
  transition: all .2s; margin-bottom: 2px; white-space: nowrap; position: relative;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--primary); color: white; }
.nav-item svg { flex-shrink: 0; width: 20px; height: 20px; }
.nav-item .nav-text { font-size: 13px; font-weight: 500; opacity: 1; transition: opacity .2s; }
.sidebar.collapsed .nav-text { opacity: 0; width: 0; overflow: hidden; }
.nav-badge {
  margin-left: auto; background: #ef4444; color: white; font-size: 10px;
  padding: 1px 6px; border-radius: 10px; flex-shrink: 0;
}
.sidebar.collapsed .nav-badge { position: absolute; right: 6px; top: 6px; font-size: 0; width: 8px; height: 8px; padding: 0; }

.sidebar-footer {
  padding: 12px; border-top: 1px solid var(--border);
}
.sidebar-footer .user-pill {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; background: var(--bg); overflow: hidden;
}
.sidebar-footer .user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: white; display: flex;
  align-items: center; justify-content: center; font-weight: 600; font-size: 13px;
  flex-shrink: 0;
}
.sidebar-footer .user-info { min-width: 0; opacity: 1; transition: opacity .2s; }
.sidebar.collapsed .user-info { opacity: 0; width: 0; }
.sidebar-footer .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; }
.sidebar-footer .user-role { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.sidebar-footer .logout-btn {
  margin-top: 8px; width: 100%; padding: 8px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
  font-size: 12px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 6px; transition: all .2s;
}
.sidebar-footer .logout-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
.sidebar.collapsed .logout-btn { padding: 8px 0; }
.sidebar.collapsed .logout-btn span { display: none; }

/* ===== MAIN CONTENT ===== */
.main-content {
  margin-left: var(--sidebar-w); min-height: 100vh;
  transition: margin-left .3s; display: flex; flex-direction: column;
}
.sidebar.collapsed ~ .main-content { margin-left: var(--sidebar-collapsed); }

/* ===== TOPBAR ===== */
.topbar {
  height: 64px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; position: sticky; top: 0; z-index: 40;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-size: 18px; font-weight: 700; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-secondary); display: flex;
  align-items: center; justify-content: center; cursor: pointer; transition: all .2s;
}
.icon-btn:hover { background: var(--bg); color: var(--text); }

/* ===== CARDS ===== */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; transition: background .3s, border-color .3s;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.card-title { font-size: 15px; font-weight: 600; }

/* ===== KPI CARDS ===== */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; display: flex; align-items: flex-start; gap: 14px;
}
.kpi-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.kpi-value { font-size: 26px; font-weight: 700; line-height: 1; }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ===== TABLES ===== */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
.data-table tr:hover td { background: var(--bg); }
.data-table tr:last-child td { border-bottom: none; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ===== STATUS BADGES ===== */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: #dcfce7; color: #166534; }
.dark .badge-green { background: #14532d; color: #86efac; }
.badge-amber { background: #fef3c7; color: #92400e; }
.dark .badge-amber { background: #78350f; color: #fcd34d; }
.badge-red { background: #fee2e2; color: #991b1b; }
.dark .badge-red { background: #7f1d1d; color: #fca5a5; }
.badge-gray { background: #f1f5f9; color: #475569; }
.dark .badge-gray { background: #334155; color: #94a3b8; }
.badge-blue { background: #dbeafe; color: #1d4ed8; }
.dark .badge-blue { background: #1e3a8a; color: #93c5fd; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { opacity: .9; transform: translateY(-1px); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn-danger:hover { background: #fecaca; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===== FORM INPUTS ===== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 14px; transition: all .2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.form-textarea { min-height: 80px; resize: vertical; }

/* ===== MODAL ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--bg); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* ===== TOAST ===== */
#toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.1);
  display: flex; align-items: center; gap: 10px; min-width: 280px;
  animation: toastIn .3s ease;
}
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-success { border-left: 4px solid #22c55e; }
.toast-error { border-left: 4px solid #ef4444; }

/* ===== CHARTS ===== */
.charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; margin-bottom: 24px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow: hidden; }

/* ===== MOBILE BOTTOM NAV with CENTERED FAB ===== */
.mobile-nav-wrap {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.mobile-nav {
  height: 60px; background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  position: relative;
}
.mobile-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; color: var(--text-secondary);
  font-size: 11px; font-weight: 500; cursor: pointer; height: 100%;
  transition: color .2s; border: none; background: none; padding: 0;
}
.mobile-nav-item.active { color: var(--primary); }
.mobile-nav-item svg { width: 22px; height: 22px; }

/* Centered FAB above nav */
.mobile-fab {
  position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--primary); color: white; border: 4px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,235,.35); cursor: pointer;
  transition: transform .2s, box-shadow .2s; z-index: 51;
}
.mobile-fab:active { transform: translateX(-50%) scale(.95); }
.mobile-fab svg { width: 24px; height: 24px; }

/* ===== MOBILE SCREENS ===== */
.mobile-screen { padding: 16px; padding-bottom: 100px; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.mobile-header h1 { font-size: 22px; font-weight: 700; }
.mobile-header .user-pill-mobile {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
}
.mobile-header .user-pill-mobile .avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--primary);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}
.mobile-header .user-pill-mobile span { font-size: 12px; font-weight: 500; }

/* Mobile stats */
.mobile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.mobile-stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 8px; text-align: center;
}
.mobile-stat .val { font-size: 22px; font-weight: 700; }
.mobile-stat .lbl { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Mobile cards */
.mobile-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; margin-bottom: 10px;
}
.mobile-card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mobile-card .psid { font-size: 15px; font-weight: 700; }
.mobile-card .meta { font-size: 12px; color: var(--text-secondary); }
.mobile-card .meta span { display: inline-flex; align-items: center; gap: 4px; }

/* Mobile filter chips */
.filter-chips { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.filter-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-secondary); font-size: 12px;
  font-weight: 500; cursor: pointer; white-space: nowrap; transition: all .2s;
}
.filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Mobile form - BIG */
.mobile-form .form-group { margin-bottom: 20px; }
.mobile-form .form-label { font-size: 14px; margin-bottom: 8px; }
.mobile-form .form-input, .mobile-form .form-select, .mobile-form .form-textarea {
  padding: 14px 16px; font-size: 16px; border-radius: 10px; min-height: 52px;
}
.mobile-form .form-textarea { min-height: 100px; }
.mobile-form .btn { padding: 14px 24px; font-size: 16px; border-radius: 10px; width: 100%; }

/* Desktop FAB */
.fab {
  position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
  border-radius: 50%; background: var(--primary); color: white; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,235,.4); cursor: pointer; z-index: 40;
  transition: transform .2s, box-shadow .2s;
}
.fab:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(37,99,235,.5); }

/* Empty state */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state p { font-size: 14px; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-fade { animation: fadeIn .4s ease; }

/* Mobile admin cards (alternative to tables) */
.mobile-list-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px; margin-bottom: 10px;
}
.mobile-list-card .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.mobile-list-card .row:not(:last-child) { border-bottom: 1px solid var(--border); }
.mobile-list-card .label { font-size: 12px; color: var(--text-secondary); }
.mobile-list-card .value { font-size: 13px; font-weight: 600; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main-content { margin-left: 0 !important; }
  .topbar { padding: 0 16px; }
  .topbar-title { font-size: 16px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-card { padding: 14px; }
  .kpi-value { font-size: 20px; }
  .charts-grid { grid-template-columns: 1fr; gap: 12px; }
  .card { padding: 14px; }
  .data-table th, .data-table td { padding: 10px 12px; font-size: 12px; }
  .fab { display: none !important; }
  .modal { max-height: 95vh; border-radius: 16px 16px 0 0; position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 100%; }
  .modal-overlay { align-items: flex-end; padding: 0; }
}
@media (min-width: 769px) {
  .mobile-nav-wrap { display: none; }
  .mobile-only { display: none !important; }
}
@media (max-width: 768px) {
  .desktop-only { display: none !important; }
}
</style>
</head>
<body class="">

<!-- Loading Overlay (for all operations) -->
<div id="loading-overlay">
  <div class="load-logo-wrap">
    <div class="load-ring"></div>
    <img src="gpc-logo.png" alt="GPC" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=font-size:48px;color:var(--primary);font-weight:800>GPC</div>'">
  </div>
  <p class="load-text" id="loading-text">Loading...</p>
</div>

<!-- Initial Loading Screen -->
<div id="loading-screen">
  <div class="load-logo-wrap">
    <div class="load-ring"></div>
    <img src="gpc-logo.png" alt="GPC" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=font-size:48px;color:var(--primary);font-weight:800>GPC</div>'">
  </div>
  <p style="margin-top:20px;color:var(--text-secondary);font-size:14px;font-weight:500;">Loading Field Survey Register...</p>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Auth Screens -->
<div id="auth-screen" style="display:none;">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);">
    <div style="width:100%;max-width:400px;">
      <div style="text-align:center;margin-bottom:32px;">
        <img src="gpc-logo.png" alt="GPC" style="width:72px;height:72px;object-fit:contain;margin-bottom:16px;" onerror="this.style.display='none'">
        <h1 style="font-size:24px;font-weight:800;">GPC Field Survey</h1>
        <p style="color:var(--text-secondary);font-size:14px;margin-top:4px;">Survey Register & Dashboard</p>
      </div>
      <div id="auth-tabs" style="display:flex;gap:8px;margin-bottom:20px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--border);">
        <button id="tab-admin" class="btn" style="flex:1;font-size:13px;" onclick="switchAuthTab('admin')">Admin Login</button>
        <button id="tab-surveyor" class="btn btn-secondary" style="flex:1;font-size:13px;" onclick="switchAuthTab('surveyor')">Surveyor Login</button>
      </div>
      <div id="auth-admin" class="card" style="padding:24px;">

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyB16RrnyX01t3TJ1h1OjOzg38z0qMj_axo",
  authDomain: "gpc-survey-register.firebaseapp.com",
  projectId: "gpc-survey-register",
  storageBucket: "gpc-survey-register.firebasestorage.app",
  messagingSenderId: "90363610387",
  appId: "1:90363610387:web:b31cf5f39dd45d63fb06e6",
  measurementId: "G-1ZM6D1CDN1"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// State
let currentUser = null;
let userProfile = null;
let currentTab = 'overview';
let mobileTab = 'home';
let recordsCache = [];
let usersCache = [];
let charts = {};
let sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
let darkMode = localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);

// Apply theme
if (darkMode) document.body.classList.add('dark');

// ===== LOADING OVERLAY =====
function showLoading(text) {
  const el = document.getElementById('loading-overlay');
  document.getElementById('loading-text').textContent = text || 'Loading...';
  el.classList.add('active');
  el.classList.remove('fade-out');
}
function hideLoading() {
  const el = document.getElementById('loading-overlay');
  el.classList.add('fade-out');
  setTimeout(() => el.classList.remove('active', 'fade-out'), 300);
}

// Icons helper
const icons = {
  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  register: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
  daily: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  productivity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  import: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
};

const tabs = [
  { id: 'overview', label: 'Overview', icon: icons.overview },
  { id: 'register', label: 'Register', icon: icons.register },
  { id: 'daily', label: 'Daily Report', icon: icons.daily },
  { id: 'productivity', label: 'Productivity', icon: icons.productivity },
  { id: 'users', label: 'Manage Users', icon: icons.users },
  { id: 'import', label: 'Import Data', icon: icons.import }
];

// Auth state
auth.onAuthStateChanged(async (user) => {
  if (user) {
    showLoading('Authenticating...');
    currentUser = user;
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) {
        userProfile = doc.data();
        if (userProfile.status === 'inactive') {
          hideLoading();
          showToast('Your account has been deactivated. Contact your administrator.', 'error');
          await auth.signOut();
          location.reload();
          return;
        }
        hideLoading();
        showApp();
      } else {
        const snap = await db.collection('users').where('role','==','admin').limit(1).get();
        if (snap.empty) {
          await db.collection('users').doc(user.uid).set({
            name: user.email.split('@')[0], email: user.email, role: 'admin',
            status: 'active', createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          userProfile = { name: user.email.split('@')[0], email: user.email, role: 'admin', status: 'active' };
          hideLoading();
          showApp();
        } else {
          hideLoading();
          showToast('Profile not found', 'error');
          await auth.signOut();
        }
      }
    } catch(e) {
      hideLoading();
      showToast(e.message, 'error');
    }
  } else {
    showAuth();
    setTimeout(() => document.getElementById('loading-screen').classList.add('hidden'), 400);
  }
});

function showAuth() {
  document.getElementById('auth-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  if (userProfile.role === 'admin') {
    document.getElementById('admin-view').style.display = '';
    document.getElementById('surveyor-view').style.display = 'none';
    initSidebar();
    renderPage();
  } else {
    document.getElementById('admin-view').style.display = 'none';
    document.getElementById('surveyor-view').style.display = '';
    renderMobileApp();
  }
}

function switchAuthTab(tab) {
  document.getElementById('tab-admin').className = tab === 'admin' ? 'btn btn-primary' : 'btn btn-secondary';
  document.getElementById('tab-surveyor').className = tab === 'surveyor' ? 'btn btn-primary' : 'btn btn-secondary';
  document.getElementById('auth-admin').style.display = tab === 'admin' ? '' : 'none';
  document.getElementById('auth-surveyor').style.display = tab === 'surveyor' ? '' : 'none';
}

async function loginAdmin() {
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  if (!email || !pass) { showToast('Enter email and password', 'error'); return; }
  showLoading('Signing in...');
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e) { hideLoading(); showToast(e.message, 'error'); }
}

async function loginSurveyor() {
  const username = document.getElementById('surveyor-user').value.trim().toLowerCase();
  const pin = document.getElementById('surveyor-pin').value;
  if (!username || !pin) { showToast('Enter username and PIN', 'error'); return; }
  showLoading('Signing in...');
  try {
    const snap = await db.collection('users').where('username','==',username).where('role','==','surveyor').limit(1).get();
    if (snap.empty) { hideLoading(); showToast('Invalid username', 'error'); return; }
    const u = snap.docs[0].data();
    if (u.status === 'inactive') { hideLoading(); showToast('Account deactivated', 'error'); return; }
    if (u.pin !== pin) { hideLoading(); showToast('Invalid PIN', 'error'); return; }
    await auth.signInAnonymously();
    currentUser = auth.currentUser;
    userProfile = { ...u, uid: snap.docs[0].id };
    hideLoading();
    showApp();
  } catch(e) { hideLoading(); showToast(e.message, 'error'); }
}

async function logout() {
  showLoading('Signing out...');
  await auth.signOut();
  location.reload();
}

// Sidebar
function initSidebar() {
  const sb = document.getElementById('sidebar');
  if (sidebarCollapsed) sb.classList.add('collapsed');
  renderSidebarNav();
  document.getElementById('sidebar-name').textContent = userProfile.name || userProfile.email || 'Admin';
  document.getElementById('sidebar-role').textContent = userProfile.role === 'admin' ? 'Administrator' : 'Surveyor';
  document.getElementById('sidebar-avatar').textContent = (userProfile.name || userProfile.email || 'A').charAt(0).toUpperCase();
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  localStorage.setItem('sidebarCollapsed', sidebarCollapsed);
}

function renderSidebarNav() {
  let html = '';
  tabs.forEach(t => {
    const active = currentTab === t.id ? 'active' : '';
    html += `<div class="nav-item ${active}" onclick="setTab('${t.id}')">${t.icon}<span class="nav-text">${t.label}</span></div>`;
  });
  document.getElementById('sidebar-nav').innerHTML = html;
}

function setTab(tab) {
  currentTab = tab;
  renderSidebarNav();
  renderPage();
}

// Theme
function toggleTheme() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  localStorage.setItem('darkMode', darkMode);
  document.getElementById('theme-icon-moon').style.display = darkMode ? 'none' : '';
  document.getElementById('theme-icon-sun').style.display = darkMode ? '' : 'none';
  if (currentTab === 'productivity') renderPage();
}

// Toast
function showToast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${type==='success'?'#22c55e':'#ef4444'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span style="font-size:13px;">${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// Sync
async function syncData() {
  showLoading('Syncing data...');
  await loadRecords(true);
  renderPage();
  hideLoading();
  showToast('Data synced');
}

// Load records
async function loadRecords(force=false) {
  if (!force && recordsCache.length) return recordsCache;
  const snap = await db.collection('records').orderBy('createdAt','desc').get();
  recordsCache = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  return recordsCache;
}

async function loadUsers(force=false) {
  if (!force && usersCache.length) return usersCache;
  const snap = await db.collection('users').get();
  usersCache = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
  return usersCache;
}

// Render admin page
async function renderPage() {
  const page = document.getElementById('page-content');
  document.getElementById('page-title').textContent = tabs.find(t => t.id === currentTab)?.label || 'Dashboard';
  await loadRecords();
  if (currentTab === 'users' || currentTab === 'productivity') await loadUsers();

  switch(currentTab) {
    case 'overview': page.innerHTML = renderOverview(); break;
    case 'register': page.innerHTML = renderRegister(); break;
    case 'daily': page.innerHTML = renderDaily(); break;
    case 'productivity': page.innerHTML = renderProductivity(); break;
    case 'users': page.innerHTML = renderUsers(); break;
    case 'import': page.innerHTML = renderImport(); break;
  }
  if (currentTab === 'overview') setTimeout(initOverviewCharts, 50);
  if (currentTab === 'productivity') setTimeout(initProductivityCharts, 50);
  if (currentTab === 'daily') setTimeout(initDailyCharts, 50);
}

          <div><div class="kpi-value">${total}</div><div class="kpi-label">Total PSIDs</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background:#dcfce7;color:#166534;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div><div class="kpi-value">${completed}</div><div class="kpi-label">Completed</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon" style="background:#fef3c7;color:#92400e;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div><div class="kpi-value">${pending}</div><div class="kpi-label">Pending</div></div>

        <div class="kpi-card">

// Import
function renderImport() {
  return `
    <div class="animate-fade">
      <div class="card" style="max-width:600px;">
        <h2 style="font-size:16px;font-weight:700;margin-bottom:8px;">Bulk Import</h2>
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:20px;">Paste tab-separated or comma-separated data. Expected columns: PSID, Surveyor, District, Tehsil, Mauza, Status, Date (YYYY-MM-DD)</p>
        <div class="form-group">
          <label class="form-label">Paste Data</label>
          <textarea id="import-data" class="form-textarea" rows="10" placeholder="PSID\tSurveyor\tDistrict\tTehsil\tMauza\tStatus\tDate"></textarea>
        </div>
        <button class="btn btn-primary" onclick="processImport()">Import Records</button>
      </div>
    </div>`;
}

async function processImport() {
  const raw = document.getElementById('import-data').value.trim();
  if (!raw) { showToast('Paste some data first', 'error'); return; }
  showLoading('Importing records...');
  const lines = raw.split('\n').filter(l => l.trim());
  let count = 0;
  const batch = db.batch();
  for (const line of lines) {
    const parts = line.includes('\t') ? line.split('\t') : line.split(',');
    if (parts.length < 3) continue;
    const ref = db.collection('records').doc();
    batch.set(ref, {
      psid: parts[0]?.trim(),
      surveyorName: parts[1]?.trim(),
      district: parts[2]?.trim(),
      tehsil: parts[3]?.trim() || '',
      mauza: parts[4]?.trim() || '',
      status: (parts[5]?.trim() || 'pending').toLowerCase(),
      date: parts[6]?.trim() || new Date().toISOString().split('T')[0],
      geometryCreated: false,
      khasraAdded: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: currentUser.uid
    });
    count++;
  }
  await batch.commit();
  hideLoading();
  showToast(`${count} records imported`);
  document.getElementById('import-data').value = '';
  await loadRecords(true);
}

function showModal(title, bodyHtml) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-modal';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close" onclick="closeModal()">&times;</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveRecord()">${editingDocId ? 'Update' : 'Save'} Record</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
}

function closeModal() {
  const m = document.getElementById('active-modal');
  if (m) m.remove();
  editingDocId = null;
}

async function saveRecord() {
  const data = {
    psid: document.getElementById('m-psid').value.trim(),
    district: document.getElementById('m-district').value.trim(),
    tehsil: document.getElementById('m-tehsil').value.trim(),
    mauza: document.getElementById('m-mauza').value.trim(),
    date: document.getElementById('m-date').value,
    status: document.getElementById('m-status').value,
    surveyorName: document.getElementById('m-surveyor').value.trim(),
    geometryCreated: document.getElementById('m-geom').value === 'true',
    khasraAdded: document.getElementById('m-khasra').value === 'true',
    remarks: document.getElementById('m-remarks').value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (!data.psid) { showToast('PSID is required', 'error'); return; }
  try {
    showLoading(editingDocId ? 'Updating record...' : 'Saving record...');
    if (editingDocId) {
      await db.collection('records').doc(editingDocId).update(data);
      hideLoading();
      showToast('Record updated');
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      data.createdBy = currentUser.uid;
      await db.collection('records').add(data);
      hideLoading();
      showToast('Record added');
    }
    closeModal();
    await loadRecords(true);
    renderPage();
  } catch(e) { hideLoading(); showToast(e.message, 'error'); }
}

async function saveUser() {
  const name = document.getElementById('u-name').value.trim();
  const username = document.getElementById('u-user').value.trim().toLowerCase();
  const pin = document.getElementById('u-pin').value.trim();
  const email = document.getElementById('u-email').value.trim();
  if (!name || !username || !pin) { showToast('Name, username and PIN required', 'error'); return; }
  if (pin.length !== 4 || !/^\d+$/.test(pin)) { showToast('PIN must be 4 digits', 'error'); return; }
  showLoading('Adding user...');
  const existing = await db.collection('users').where('username','==',username).limit(1).get();
  if (!existing.empty) { hideLoading(); showToast('Username already exists', 'error'); return; }
  await db.collection('users').add({
    name, username, pin, email: email || null, role: 'surveyor',
    status: 'active', createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  hideLoading();
  showToast('User added successfully');
  closeModal();
  await loadUsers(true);
  renderPage();
}

// Service Worker for PWA - NETWORK FIRST for HTML
if ('serviceWorker' in navigator) {
  const swCode = encodeURIComponent(`
    const CACHE_NAME = 'gpc-survey-v1';
    const urlsToCache = ['./','./manifest.json','./gpc-logo.png'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache)));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(clients.claim());
    });
    self.addEventListener('fetch', e => {
      if (e.request.mode === 'navigate') {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      } else {
        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
      }
    });
  `);
  navigator.serviceWorker.register('data:text/javascript,' + swCode).catch(() => {});
}
